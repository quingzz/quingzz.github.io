# This is a basic workflow to help you get started with Actions
on:
  push:
    branches:
      - main

name: Quarto render and publish

# you need these permissions to publish to GitHub pages
permissions: 
    contents: write
    pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Install system dependencies
        run: | 
            sudo add-apt-repository universe
            sudo apt-get update 
            sudo apt-get install -y \
             libcurl4-openssl-dev \
             libfontconfig1-dev \
              libfreetype6-dev \
              libfribidi-dev \
              libharfbuzz-dev \
              libjpeg-dev \
              libpng-dev \
              libtiff-dev \
              libx11-dev \
              pandoc
        
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2

      - name: Setup `tlmgr` through R `tinytex`
        run: Rscript -e 'tinytex::install_tinytex();tinytex::tlmgr_update();tinytex::tlmgr_install("libertine")'

      - name: Publish to GitHub Pages (and render) 
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
